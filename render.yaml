# Render "Blueprint" — deploys the full-stack SheShield app automatically.
# Push this repo to GitHub, then in Render: New -> Blueprint -> connect this repo.
# Render will create the web service + Postgres DB and give you a live URL.

services:
  - type: web
    name: sheshield-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: cd ../frontend && npm install && npm run build && cd ../backend && npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: EMAIL_PROVIDER
        value: dev
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sheshield-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: "http://localhost:5173"
      - key: FRONTEND_URL
        value: "http://localhost:5173"

databases:
  - name: sheshield-db
    plan: free
